<body>

    <a href="/merchants.html" class="rail-btn" title="Merchants">

<!-- ═══════════════════════════════════════════════════════════
     MAIN APP
     ═══════════════════════════════════════════════════════════ -->
<div class="app">

  <!-- Top bar -->
  <header class="topbar">
    <div class="topbar-title">Dashboard</div>
    <div class="topbar-live">
      <span class="live-dot"></span>
      <span>LIVE</span>
    </div>
    <div class="topbar-search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" placeholder="Search merchants, customers..." id="search" />
    </div>
    <div class="topbar-clock" id="clock">--:--:--</div>
  </header>

  <!-- Three-column content grid -->
  <div class="content">

    <!-- ═════════ LEFT PANEL ═════════ -->
    <div class="col-left">

      <!-- Merchants card -->
      <div class="card">
        <div class="card-head">
          <div class="card-head-left">
            <span class="card-icon card-icon-teal">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h.01M9 13h.01M9 17h.01M15 9h.01M15 13h.01M15 17h.01"/>
              </svg>
            </span>
            <span class="card-title">Merchants</span>
          </div>
          <span class="card-badge" id="m-total">0</span>
        </div>
        <div class="breakdown">
          <div class="bd-row">
            <span class="bd-indicator bd-ok"></span>
            <span class="bd-name">Verified</span>
            <span class="bd-num" id="m-verified">0</span>
          </div>
          <div class="bd-row">
            <span class="bd-indicator bd-warn"></span>
            <span class="bd-name">Pending</span>
            <span class="bd-num" id="m-pending">0</span>
          </div>
          <div class="bd-row">
            <span class="bd-indicator bd-fail"></span>
            <span class="bd-name">Failed</span>
            <span class="bd-num" id="m-failed">0</span>
          </div>
        </div>
      </div>

      <!-- Customers card -->
      <div class="card">
        <div class="card-head">
          <div class="card-head-left">
            <span class="card-icon card-icon-indigo">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
            <span class="card-title">Customers</span>
          </div>
          <span class="card-badge" id="c-total">0</span>
        </div>
        <div class="breakdown">
          <div class="bd-row">
            <span class="bd-indicator bd-ok"></span>
            <span class="bd-name">Verified</span>
            <span class="bd-num" id="c-verified">0</span>
          </div>
          <div class="bd-row">
            <span class="bd-indicator bd-warn"></span>
            <span class="bd-name">Pending</span>
            <span class="bd-num" id="c-pending">0</span>
          </div>
          <div class="bd-row">
            <span class="bd-indicator bd-fail"></span>
            <span class="bd-name">Failed</span>
            <span class="bd-num" id="c-failed">0</span>
          </div>
        </div>
      </div>

      <!-- System status -->
      <div class="card">
        <div class="card-head">
          <div class="card-head-left">
            <span class="card-icon card-icon-lime">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
              </svg>
            </span>
            <span class="card-title">System status</span>
          </div>
        </div>
        <div class="status-list">
          <div class="status-item">
            <span class="status-dot status-dot-ok"></span>
            <span class="status-label">Kafka consumer</span>
            <span class="status-value">active</span>
          </div>
          <div class="status-item">
            <span class="status-dot status-dot-ok"></span>
            <span class="status-label">Provider API</span>
            <span class="status-value">ok</span>
          </div>
          <div class="status-item">
            <span class="status-dot status-dot-ok"></span>
            <span class="status-label">Database</span>
            <span class="status-value">connected</span>
          </div>
          <div class="status-item">
            <span class="status-dot status-dot-ok"></span>
            <span class="status-label">Agent scheduler</span>
            <span class="status-value">every 10s</span>
          </div>
        </div>
      </div>

    </div>

    <!-- ═════════ CENTER PANEL ═════════ -->
    <div class="col-center">

      <!-- Success rate -->
      <div class="card card-gauge">
        <div class="card-head">
          <div class="card-head-left">
            <span class="card-icon card-icon-lime">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <path d="M12 6v6l4 2"/>
              </svg>
            </span>
            <span class="card-title">Success rate</span>
          </div>
          <span class="card-badge card-badge-lime" id="gaugeDelta">+0.0%</span>
        </div>
        <div class="gauge-body">
          <div class="gauge-wrap">
            <canvas id="gaugeChart" width="220" height="220"></canvas>
            <div class="gauge-center">
              <div class="gauge-value" id="gaugeValue">--.-</div>
              <div class="gauge-unit">%</div>
            </div>
          </div>
          <div class="gauge-readout">
            <div class="readout-line">
              <span class="readout-label">
                <span class="dot dot-ok"></span>Passed
              </span>
              <span class="readout-value readout-ok" id="g-verified">0</span>
            </div>
            <div class="readout-line">
              <span class="readout-label">
                <span class="dot dot-fail"></span>Failed
              </span>
              <span class="readout-value readout-fail" id="g-failed">0</span>
            </div>
            <div class="readout-line">
              <span class="readout-label">
                <span class="dot dot-warn"></span>Pending
              </span>
              <span class="readout-value readout-warn" id="g-pending">0</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Failure reasons -->
      <div class="card">
        <div class="card-head">
          <div class="card-head-left">
            <span class="card-icon card-icon-red">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                <line x1="12" y1="9" x2="12" y2="13"/>
                <line x1="12" y1="17" x2="12.01" y2="17"/>
              </svg>
            </span>
            <span class="card-title">Failure reasons</span>
          </div>
        </div>
        <div class="failure-list" id="failureList"></div>
      </div>

    </div>

    <!-- ═════════ RIGHT PANEL ═════════ -->
    <div class="col-right">

      <div class="card card-ticker">
        <div class="card-head">
          <div class="card-head-left">
            <span class="card-icon card-icon-teal">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
              </svg>
            </span>
            <span class="card-title">Recent verifications</span>
          </div>
          <span class="card-badge" id="ticker-count">0</span>
        </div>
        <div class="ticker" id="ticker"></div>
      </div>

    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
  /* ─── Clock ─── */
  function tick() {
    document.getElementById('clock').textContent = new Date().toTimeString().slice(0, 8);
  }
  tick();
  setInterval(tick, 1000);

  /* ─── Utils ─── */
  function animateNumber(el, target) {
    if (!el) return;
    const start = parseInt(el.textContent.replace(/\D/g, '')) || 0;
    const duration = 500;
    const t0 = performance.now();
    function step(t) {
      const p = Math.min(1, (t - t0) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(start + (target - start) * eased).toLocaleString();
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function setText(id, v) {
    const el = document.getElementById(id);
    if (el) el.textContent = typeof v === 'number' ? v.toLocaleString() : v;
  }

  function timeAgo(iso) {
    if (!iso) return '—';
    const d = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
    if (d < 60) return Math.floor(d) + 's';
    if (d < 3600) return Math.floor(d / 60) + 'm';
    if (d < 86400) return Math.floor(d / 3600) + 'h';
    return Math.floor(d / 86400) + 'd';
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  /* ─── Ticker ─── */
  async function loadTicker() {
  try {
    const [merchants, customers, agentRuns] = await Promise.all([
      fetch('/api/merchants').then(r => r.json()),
      fetch('/api/customers').then(r => r.json()),
      fetch('/api/agent/runs').then(r => r.json()).catch(() => [])
    ]);

    const items = [];

    // ── Merchants
    for (const m of merchants) {
      const status = (m.panStatus === 'FAILED' || m.aadhaarStatus === 'FAILED' || m.gstStatus === 'FAILED')
        ? 'FAILED'
        : (m.panStatus === 'VERIFIED' && m.aadhaarStatus === 'VERIFIED' && m.gstStatus === 'VERIFIED')
          ? 'VERIFIED' : 'PENDING';
      items.push({
        type: 'MERCHANT',
        name: m.merchantName,
        status,
        time: m.createdAt
      });
    }

    // ── Customers
    for (const c of customers) {
      items.push({
        type: 'CUSTOMER',
        name: c.fullName,
        status: c.kycStatus,
        time: c.createdAt
      });
    }

    // ── Agent runs (last 5)
    for (const r of agentRuns.slice(0, 5)) {
      items.push({
        type: 'AGENT',
        name: r.taskName + (r.success ? ' · success' : ' · failed'),
        status: r.success ? 'VERIFIED' : 'FAILED',
        time: r.startedAt
      });
    }

    // ── Sort by newest first
    items.sort((a, b) => new Date(b.time) - new Date(a.time));
    const top = items.slice(0, 14);

    const ticker = document.getElementById('ticker');
    ticker.innerHTML = top.map(i => {
      const cls = 'trow ticker-' + i.status.toLowerCase();
      const typeLabel = i.type === 'MERCHANT' ? 'Merchant'
                      : i.type === 'CUSTOMER' ? 'Customer'
                      : 'Agent';
      const prefix = i.type === 'AGENT' ? '🤖 ' : '';
      return `
        <div class="${cls}">
          <span class="tdot tdot-${i.status.toLowerCase()}"></span>
          <span class="tname">
            <span class="ttype">${typeLabel}</span>
            ${prefix}${esc(i.name)}
          </span>
          <span class="ttime">${timeAgo(i.time)}</span>
        </div>
      `;
    }).join('');

    document.getElementById('ticker-count').textContent = items.length;
  } catch (e) {
    console.warn('ticker load failed', e);
  }
}

  /* ─── Gauge ─── */
  let gauge;
  function renderGauge(rate, ok, fail, pending) {
    const ctx = document.getElementById('gaugeChart').getContext('2d');
    if (gauge) gauge.destroy();

    gauge = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: ['Passed', 'Failed'],
        datasets: [{
          data: [ok, fail || 0.0001],
          backgroundColor: ['#b4f34d', '#ff4d6d'],
          borderWidth: 0,
          cutout: '80%',
          circumference: 270,
          rotation: 225
        }]
      },
      options: {
        responsive: false,
        plugins: { legend: { display: false }, tooltip: { enabled: false } },
        animation: { animateRotate: true, duration: 700 }
      }
    });

    const el = document.getElementById('gaugeValue');
    const start = parseFloat(el.textContent) || 0;
    const t0 = performance.now();
    function step(t) {
      const p = Math.min(1, (t - t0) / 700);
      const eased = 1 - Math.pow(1 - p, 3);
      el.textContent = (start + (rate - start) * eased).toFixed(1);
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);

    setText('g-verified', ok);
    setText('g-failed', fail);
    setText('g-pending', pending);
  }

  /* ─── Failures ─── */
  async function loadFailures() {
    try {
      const data = await fetch('/api/analytics/failure-reasons').then(r => r.json());
      const list = document.getElementById('failureList');

      if (!data.reasons || data.reasons.length === 0) {
        list.innerHTML = `<div class="empty-ok">All checks passed ✅</div>`;
        return;
      }

      list.innerHTML = data.reasons.map(r => {
        const pct = Math.max(2, Math.round(r.percentage));
        return `
          <div class="frow">
            <span class="fname">${r.reason.replace(/_/g, ' ')}</span>
            <span class="fbar-wrap"><span class="fbar" style="width:${pct}%"></span></span>
            <span class="fcount">${r.count}</span>
            <span class="fpct">${r.percentage.toFixed(1)}%</span>
          </div>`;
      }).join('');
    } catch (e) {
      console.warn('failures', e);
    }
  }

  /* ─── SSE ─── */
  const stats = new EventSource('/api/ops/stats/stream');
  stats.addEventListener('stats', ev => {
    const s = JSON.parse(ev.data);

    animateNumber(document.getElementById('m-total'), s.merchants.total);
    setText('m-verified', s.merchants.verified);
    setText('m-pending', s.merchants.pending);
    setText('m-failed', s.merchants.failed);

    animateNumber(document.getElementById('c-total'), s.customers.total);
    setText('c-verified', s.customers.verified);
    setText('c-pending', s.customers.pending);
    setText('c-failed', s.customers.failed);

    fetch('/api/analytics/success-rate')
      .then(r => r.json())
      .then(r => renderGauge(r.rate, r.verified, r.failed, r.pending))
      .catch(() => {});
  });

  /* ─── Init ─── */
  loadTicker();
  loadFailures();
  fetch('/api/analytics/success-rate')
    .then(r => r.json())
    .then(r => renderGauge(r.rate, r.verified, r.failed, r.pending));

  setInterval(loadTicker, 5000);
  setInterval(loadFailures, 15000);

  stats.onerror = () => console.warn('stats stream error');
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ops Dashboard — KYC</title>
<link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>

<header class="header">
  <div class="brand">
    <span class="brand-logo">K</span>
    <span>KYC Ops Dashboard</span>
  </div>
  <div class="actions">
    <a href="/" class="btn">💬 Chat</a>
    <a href="/merchants.html" class="btn">📋 Merchants</a>
    <span class="live"><span class="dot"></span> Live</span>
  </div>
</header>

<main>
  <!-- KPI cards -->
  <section class="kpis">
    <div class="kpi">
      <div class="kpi-label">Merchants</div>
      <div class="kpi-value" id="m-total">—</div>
      <div class="kpi-sub" id="m-sub">verified 0 · pending 0 · failed 0</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Customers</div>
      <div class="kpi-value" id="c-total">—</div>
      <div class="kpi-sub" id="c-sub">verified 0 · pending 0 · failed 0</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Verified checks</div>
      <div class="kpi-value" id="v-total">—</div>
      <div class="kpi-sub">across merchants & customers</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Feedback events</div>
      <div class="kpi-value" id="f-total">—</div>
      <div class="kpi-sub">user ratings captured</div>
    </div>
  </section>

  <!-- Chart + activity -->
  <section class="grid">
    <div class="panel">
      <div class="panel-title">Verification trend</div>
      <canvas id="spark" height="120"></canvas>
    </div>
    <div class="panel panel-activity">
      <div class="panel-title">
        Live activity
        <span class="badge-count" id="event-count">0</span>
      </div>
      <ul id="activity" class="activity"></ul>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
  /* ---------- animated KPI counters ---------- */
  function animateNumber(el, target) {
    const start = parseInt(el.textContent.replace(/\D/g, '')) || 0;
    const duration = 500;
    const t0 = performance.now();
    function step(t) {
      const p = Math.min(1, (t - t0) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(start + (target - start) * eased);
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  /* ---------- sparkline chart ---------- */
  let chart;
  function initChart(labels, data) {
    const ctx = document.getElementById('spark').getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, 0, 200);
    grad.addColorStop(0, 'rgba(79,91,213,0.35)');
    grad.addColorStop(1, 'rgba(20,184,166,0.02)');

    chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [{
          data,
          borderColor: '#4f5bd5',
          backgroundColor: grad,
          borderWidth: 2,
          fill: true,
          tension: 0.4,
          pointRadius: 0,
          pointHoverRadius: 5
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { enabled: true } },
        scales: {
          x: { display: false },
          y: {
            display: true,
            grid: { color: 'rgba(79,91,213,0.08)' },
            ticks: { color: '#8b90a6', font: { size: 10 } },
            beginAtZero: true
          }
        }
      }
    });
  }

  /* ---------- SSE: stats ---------- */
  const stats = new EventSource('/api/ops/stats/stream');
  stats.onmessage = ev => {
    const s = JSON.parse(ev.data);
    animateNumber(document.getElementById('m-total'), s.merchants.total);
    animateNumber(document.getElementById('c-total'), s.customers.total);
    animateNumber(document.getElementById('v-total'),
      s.merchants.verified + s.customers.verified);
    animateNumber(document.getElementById('f-total'), s.feedback);

    document.getElementById('m-sub').textContent =
      `verified ${s.merchants.verified} · pending ${s.merchants.pending} · failed ${s.merchants.failed}`;
    document.getElementById('c-sub').textContent =
      `verified ${s.customers.verified} · pending ${s.customers.pending} · failed ${s.customers.failed}`;

    if (!chart) {
      const labels = s.sparkline.map((_, i) => i);
      initChart(labels, s.sparkline);
    } else {
      chart.data.datasets[0].data = s.sparkline;
      chart.update('none');
    }
  };

  /* ---------- SSE: activity feed ---------- */
  const activity = document.getElementById('activity');
  const eventCount = document.getElementById('event-count');
  let count = 0;

  const events = new EventSource('/api/ops/events/stream');
  events.onmessage = ev => {
    const e = JSON.parse(ev.data);
    const li = document.createElement('li');
    li.className = 'event event-' + (e.type || 'default');

    const icon = { verify: '✓', create: '＋', fail: '✗' }[e.type] || '•';
    const time = new Date(e.timestamp).toLocaleTimeString();

    li.innerHTML = `
      <span class="event-icon">${icon}</span>
      <span class="event-msg">${e.message}</span>
      <span class="event-time">${time}</span>
    `;
    activity.prepend(li);
    while (activity.children.length > 40) activity.lastChild.remove();

    count++;
    eventCount.textContent = count;
  };

  stats.onerror = () => console.warn('stats stream error');
  events.onerror = () => console.warn('events stream error');
</script>
</body>
</html>

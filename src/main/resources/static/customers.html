<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customers — KYC</title>
<link rel="stylesheet" href="/css/customers.css">
</head>
<body>

<header class="topbar">
  <a href="/" class="brand">← Back to Chat</a>
  <h1>Customers</h1>

  <div class="filters">
    <button class="filter active" data-status="ALL">All</button>
    <button class="filter" data-status="VERIFIED">✅ Verified</button>
    <button class="filter" data-status="PENDING">⏳ Pending</button>
    <button class="filter" data-status="FAILED">❌ Failed</button>
  </div>

  <input id="search" placeholder="Search name / email / ID / city..." autocomplete="off">
  <span id="count" class="count">—</span>
</header>

<main>
  <table id="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>ID Type</th>
        <th>ID Number</th>
        <th>City / State</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="tbody">
      <tr><td colspan="9" class="loading">Loading…</td></tr>
    </tbody>
  </table>
</main>

<script>
  const tbody   = document.getElementById('tbody');
  const search  = document.getElementById('search');
  const countEl = document.getElementById('count');
  const filters = document.querySelectorAll('.filter');

  let allRows = [];
  let activeStatus = 'ALL';

  function statusBadge(s) {
    const cls = (s || '').toLowerCase();
    return `<span class="badge badge-${cls}">${s || '—'}</span>`;
  }

  function mask(v) {
    if (!v || v.length < 4) return v || '';
    return '****' + v.slice(-4);
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function render(rows) {
    if (!rows.length) {
      tbody.innerHTML = `<tr><td colspan="9" class="empty">No customers match.</td></tr>`;
      return;
    }
    tbody.innerHTML = rows.map(c => `
      <tr data-id="${c.id}">
        <td class="mono">${c.id}</td>
        <td><strong>${escapeHtml(c.fullName)}</strong></td>
        <td>${escapeHtml(c.email)}</td>
        <td>${escapeHtml(c.phone)}</td>
        <td class="mono">${escapeHtml(c.idType)}</td>
        <td class="mono">${escapeHtml(mask(c.idNumber))}</td>
        <td>${escapeHtml(c.city)}<span class="muted">, ${escapeHtml(c.state)}</span></td>
        <td>${statusBadge(c.kycStatus)}</td>
        <td>
          <button class="btn-verify"
                  onclick="verify(${c.id}, this)"
                  ${c.kycStatus !== 'PENDING' ? 'disabled' : ''}>
            Verify
          </button>
        </td>
      </tr>
    `).join('');
  }

  async function load() {
    try {
      const res = await fetch('/api/customers');
      allRows = await res.json();
      applyFilters();
    } catch (e) {
      tbody.innerHTML = `<tr><td colspan="9" class="empty">Error: ${e.message}</td></tr>`;
    }
  }

  async function verify(id, btn) {
    btn.disabled = true;
    btn.textContent = '…';
    try {
      const res = await fetch(`/api/customers/${id}/verify`, { method: 'POST' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const updated = await res.json();
      allRows = allRows.map(c => c.id === updated.id ? updated : c);
      applyFilters();
    } catch (e) {
      alert('Verify failed: ' + e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Verify';
    }
  }

  function applyFilters() {
    let rows = allRows;

    if (activeStatus !== 'ALL') {
      rows = rows.filter(c => c.kycStatus === activeStatus);
    }

    const q = search.value.trim().toLowerCase();
    if (q) {
      rows = rows.filter(c =>
        (c.fullName || '').toLowerCase().includes(q) ||
        (c.email    || '').toLowerCase().includes(q) ||
        (c.idNumber || '').toLowerCase().includes(q) ||
        (c.city     || '').toLowerCase().includes(q) ||
        (c.state    || '').toLowerCase().includes(q)
      );
    }

    render(rows);
    countEl.textContent = rows.length + ' / ' + allRows.length;
  }

  filters.forEach(f => {
    f.onclick = () => {
      filters.forEach(x => x.classList.remove('active'));
      f.classList.add('active');
      activeStatus = f.dataset.status;
      applyFilters();
    };
  });

  search.addEventListener('input', applyFilters);
  load();
</script>
</body>
</html>

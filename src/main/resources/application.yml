server:
  port: ${PORT:8080}

spring:
  application:
    name: merchant-kyc-ai

  datasource:
    url: jdbc:h2:file:D:/sayan/java_projects/merchant-kyc-ai-spring-boot/data/kycdb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen2.5:7b
          temperature: 0.1

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.isg.kyc.event"
        spring.json.use.type.headers: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

kyc:
  providers:
    pan:
      base-url: ${PAN_KYC_BASE_URL:https://sandbox.example.com/pan}
      api-key: ${PAN_KYC_API_KEY:}
    aadhaar:
      base-url: ${AADHAAR_KYC_BASE_URL:https://sandbox.example.com/aadhaar}
      api-key: ${AADHAAR_KYC_API_KEY:}
    gst:
      base-url: ${GST_KYC_BASE_URL:https://sandbox.example.com/gst}
      api-key: ${GST_KYC_API_KEY:}

  reports:
    filename-prefix: kyc-report
    max-rows-per-sheet: 10000

agent:
  enabled: true
  auto-verify-cron: "*/10 * * * * *"